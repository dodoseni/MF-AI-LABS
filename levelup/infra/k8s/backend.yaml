apiVersion: apps/v1
kind: Deployment
metadata:
  name: levelup-backend
  labels:
    app: levelup
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: levelup
      component: backend
  template:
    metadata:
      labels:
        app: levelup
        component: backend
    spec:
      containers:
        - name: backend
          image: <ACR_LOGIN_SERVER>/levelup-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: levelup-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: levelup-backend
  labels:
    app: levelup
    component: backend
spec:
  selector:
    app: levelup
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
